<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070812"/>
      <stop offset="0.55" stop-color="#0B0A1C"/>
      <stop offset="1" stop-color="#05060B"/>
    </linearGradient>
    <radialGradient id="core" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(690 330) rotate(90) scale(310)">
      <stop stop-color="#818CF8" stop-opacity="0.78"/>
      <stop offset="0.45" stop-color="#6366F1" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(930 560) rotate(90) scale(230)">
      <stop stop-color="#22D3EE" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="420" y1="230" x2="930" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A5B4FC" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#818CF8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#94A3B8" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <circle cx="690" cy="330" r="300" fill="url(#core)" filter="url(#blur)"/>
  <circle cx="930" cy="560" r="220" fill="url(#cyanGlow)" filter="url(#blur)"/>

  <g transform="rotate(-18 660 390)">
    <ellipse cx="660" cy="390" rx="330" ry="128" stroke="url(#ring)" stroke-width="1.5"/>
    <ellipse cx="660" cy="390" rx="248" ry="96" stroke="#A5B4FC" stroke-opacity="0.28" stroke-width="1"/>
    <ellipse cx="660" cy="390" rx="168" ry="64" stroke="#22D3EE" stroke-opacity="0.3" stroke-width="1"/>
  </g>

  <circle cx="660" cy="380" r="78" fill="#0B0D18"/>
  <circle cx="660" cy="380" r="78" stroke="url(#ring)" stroke-width="1.5"/>
  <circle cx="660" cy="380" r="54" fill="#14162A"/>
  <circle cx="660" cy="380" r="54" stroke="#A5B4FC" stroke-opacity="0.35"/>
  <circle cx="660" cy="360" r="18" fill="#A5B4FC" fill-opacity="0.85"/>
  <circle cx="660" cy="360" r="18" fill="#A5B4FC" filter="url(#soft)"/>

  <g fill="#E2E8F0">
    <circle cx="318" cy="250" r="3" fill-opacity="0.8"/>
    <circle cx="1010" cy="198" r="2.5" fill-opacity="0.6"/>
    <circle cx="870" cy="676" r="2" fill-opacity="0.5"/>
    <circle cx="250" cy="560" r="2" fill-opacity="0.45"/>
    <circle cx="1080" cy="430" r="3" fill-opacity="0.7"/>
    <circle cx="430" cy="650" r="2" fill-opacity="0.4"/>
    <circle cx="790" cy="130" r="2" fill-opacity="0.5"/>
  </g>

  <g stroke="#A5B4FC" stroke-opacity="0.25">
    <path d="M318 250L660 380" stroke-dasharray="3 7"/>
    <path d="M1010 198L660 380" stroke-dasharray="3 7"/>
    <path d="M1080 430L660 380" stroke-dasharray="3 7"/>
    <path d="M870 676L660 380" stroke-dasharray="3 7"/>
  </g>

  <rect x="76" y="628" width="210" height="52" rx="14" fill="#0B0D18" stroke="#A5B4FC" stroke-opacity="0.22"/>
  <circle cx="104" cy="654" r="5" fill="#22D3EE"/>
  <rect x="120" y="646" width="124" height="6" rx="3" fill="#E2E8F0" fill-opacity="0.42"/>
  <rect x="120" y="658" width="78" height="5" rx="2.5" fill="#E2E8F0" fill-opacity="0.18"/>

  <rect x="900" y="92" width="180" height="112" rx="18" fill="#0B0D18" stroke="#A5B4FC" stroke-opacity="0.22"/>
  <rect x="924" y="118" width="72" height="6" rx="3" fill="#A5B4FC" fill-opacity="0.7"/>
  <rect x="924" y="136" width="130" height="5" rx="2.5" fill="#E2E8F0" fill-opacity="0.16"/>
  <rect x="924" y="150" width="104" height="5" rx="2.5" fill="#E2E8F0" fill-opacity="0.12"/>
  <rect x="924" y="172" width="46" height="16" rx="8" fill="#6366F1" fill-opacity="0.35"/>
